<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bulk Email Sender</title>

  <style>
    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      padding: 10px;
      margin: 15px 0;
    }

    button {
      padding: 12px 25px;
      background: #00ffaa;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>📧 Bulk Email Sender</h1>

  <input type="file" id="csvFile" accept=".csv"><br>

  <button onclick="sendCSV()">Upload CSV & Send</button>

  <div id="status"></div>

<script>
async function sendCSV() {
  const fileInput = document.getElementById("csvFile");
  const status = document.getElementById("status");

  if (!fileInput.files.length) {
    alert("Please select a CSV file");
    return;
  }

  const formData = new FormData();
  formData.append("csvFile", fileInput.files[0]);

  status.innerHTML = "⏳ Uploading & Sending emails...";

  try {
    const response = await fetch(
      "https://glowaix-email-server-1.onrender.com/upload-csv",
      {
        method: "POST",
        body: formData
      }
    );

    const data = await response.json();

    if (data.success) {
      status.innerHTML = `
        ✅ Sent: ${data.sent} <br>
        ❌ Failed: ${data.failed} <br>
        📦 Total: ${data.total}
      `;
    } else {
      status.innerHTML = "❌ Error: " + data.error;
    }

  } catch (err) {
    status.innerHTML = "❌ Network Error: " + err.message;
  }
}
</script>

</body>
</html>
